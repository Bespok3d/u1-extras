# Print Lifecycle Hooks
#
# Overrides PRINT_START / PRINT_END / CANCEL_PRINT so that any macro named with the matching
# prefix is discovered and run automatically. Hooks run in SORTED name order: prefix with a
# number to control sequencing (e.g. _PRINT_START_10_x, _PRINT_START_20_y).
#
# DANGER: order is only as stable as the names. Two hooks that must run in a fixed order MUST be
# numbered; an unnumbered hook that depends on another can run at the wrong time. Experimental.

[gcode_macro PRINT_START]
rename_existing: _HOOKS_PRINT_START_BASE
gcode:
    {% for hook in printer.configfile.config | select("startswith", "gcode_macro _PRINT_START_") | sort %}
        {hook[12:]}
    {% endfor %}
    _HOOKS_PRINT_START_BASE {rawparams}

[gcode_macro PRINT_END]
rename_existing: _HOOKS_PRINT_END_BASE
gcode:
    {% for hook in printer.configfile.config | select("startswith", "gcode_macro _PRINT_END_") | sort %}
        {hook[12:]}
    {% endfor %}
    _HOOKS_PRINT_END_BASE {rawparams}

[gcode_macro CANCEL_PRINT]
rename_existing: _HOOKS_CANCEL_PRINT_BASE
gcode:
    {% for hook in printer.configfile.config | select("startswith", "gcode_macro _CANCEL_PRINT_") | sort %}
        {hook[12:]}
    {% endfor %}
    _HOOKS_CANCEL_PRINT_BASE {rawparams}
